<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لحورية ❤</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg1:#1a0b2e;--bg2:#3b0d3f;--pink:#ff4d8d;--rose:#ff9ac1;--gold:#ffd27a;--text:#fff1f6}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Cairo',Tahoma,sans-serif;color:var(--text);background:radial-gradient(ellipse at 50% 120%,var(--bg2),var(--bg1) 70%);overflow:hidden;text-align:center}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.blob{position:fixed;width:60vmax;height:60vmax;border-radius:50%;opacity:.3;pointer-events:none;will-change:transform;animation:drift 20s ease-in-out infinite alternate}
.b1{background:radial-gradient(circle,#ff4d8d,transparent 65%);top:-25vmax;left:-20vmax}.b2{background:radial-gradient(circle,#7b2cbf,transparent 65%);bottom:-28vmax;right:-20vmax;animation-delay:-8s}
@keyframes drift{to{transform:translate(12vw,9vh) scale(1.15)}}
#snd{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:20;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-size:1.1rem;cursor:pointer}
.stage{position:fixed;inset:0;display:flex;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));opacity:0;visibility:hidden;transform:scale(.97);transition:opacity .8s,visibility .8s,transform .8s;z-index:2}
.stage.on{opacity:1;visibility:visible;transform:none}
.in{margin:auto;width:100%;max-width:560px}
h1{font-size:clamp(2rem,8vw,3.6rem);margin:.2em 0;font-weight:900;background:linear-gradient(90deg,var(--rose),var(--gold),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200%;animation:shine 4s linear infinite}
@keyframes shine{to{background-position:200% 0}}
.hint{color:var(--rose);opacity:.85;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.97)}}
.sub{color:var(--rose);margin:4px 0 8px}

.lock{font-size:4.5rem;animation:float 3s ease-in-out infinite}
.dob{display:flex;gap:10px;justify-content:center;margin:18px 0}
.dob input{width:72px;padding:12px 6px;text-align:center;font:900 1.4rem Cairo,Tahoma,sans-serif;color:#fff;background:rgba(255,255,255,.08);border:2px solid rgba(255,154,193,.5);border-radius:14px;outline:0}
.dob input.y{width:112px}
.dob input:focus{border-color:var(--pink);box-shadow:0 0 16px rgba(255,77,141,.6)}
.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.ubtn{padding:12px 34px;border:0;border-radius:50px;font:900 1.1rem Cairo,Tahoma,sans-serif;color:#fff;background:linear-gradient(90deg,var(--pink),#c2255c);cursor:pointer;box-shadow:0 0 24px rgba(255,77,141,.6)}
#lmsg{min-height:3.2em;margin-top:14px;color:var(--rose)}

/* envelope */
.env{position:relative;width:min(78vw,300px);height:min(52vw,200px);margin:24px auto;cursor:pointer;animation:float 3s ease-in-out infinite;perspective:600px}
@keyframes float{50%{transform:translateY(-14px) rotate(-1.5deg)}}
.env .body{position:absolute;inset:0;background:linear-gradient(135deg,#ff7aa8,#d6336c);border-radius:10px;box-shadow:0 0 30px rgba(255,77,141,.6)}
.env .flap{position:absolute;top:0;left:0;right:0;height:60%;background:linear-gradient(#ff9ac1,#e0457d);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s;z-index:3;border-radius:10px 10px 0 0}
.env .seal{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);font-size:2.4rem;z-index:4;animation:beat 1s infinite;transition:opacity .4s}
@keyframes beat{50%{transform:translate(-50%,-50%) scale(1.25)}}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env.open .seal{opacity:0}
.env .paper{position:absolute;left:8%;right:8%;top:8%;bottom:8%;background:#fff8f0;border-radius:6px;z-index:2;transition:transform .8s .5s}
.env.open .paper{transform:translateY(-60%)}

/* letter */
.msg{max-width:520px;margin:0 auto;font-size:clamp(1.1rem,4.6vw,1.5rem);line-height:2}
.msg p{margin:.4em 0;opacity:0;transform:translateY(16px);transition:opacity 1s,transform 1s}
.msg p.show{opacity:1;transform:none}
.msg b{color:var(--gold)}
.next{margin-top:22px;padding:12px 30px;border:0;border-radius:50px;font:700 1.1rem Cairo,Tahoma,sans-serif;color:#fff;background:linear-gradient(90deg,var(--pink),#c2255c);cursor:pointer;box-shadow:0 0 24px rgba(255,77,141,.6);opacity:0;pointer-events:none;transition:opacity .8s}
.next.show{opacity:1;pointer-events:auto}
.q{font-size:clamp(1.8rem,7.5vw,3rem);font-weight:900;margin-bottom:16px;text-shadow:0 0 25px var(--pink)}

/* reasons */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.card{height:112px;perspective:700px;cursor:pointer;animation:pop .6s both}
@keyframes pop{from{opacity:0;transform:scale(.6) translateY(20px)}}
.card .i{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.card.flip .i{transform:rotateY(180deg)}
.card .f,.card .k{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;font-weight:700}
.card .f{background:linear-gradient(135deg,#ff7aa8,#c2255c);box-shadow:0 0 20px rgba(255,77,141,.4);font-size:1.05rem}
.card .f span{font-size:1.9rem}
.card .k{background:#fff8f0;color:#7a1f45;transform:rotateY(180deg);font-size:.95rem;line-height:1.6}

/* promises */
.pl{list-style:none;padding:0;margin:16px 0;text-align:right}
.pl li{display:flex;align-items:center;gap:14px;padding:12px 14px;margin:10px 0;border-radius:14px;background:rgba(255,255,255,.07);font-size:1.1rem;opacity:.45;transition:all .6s}
.pl .ck{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--rose);display:grid;place-items:center;transition:all .5s;color:transparent}
.pl li.ok{opacity:1;background:rgba(255,77,141,.16)}
.pl li.ok .ck{background:var(--pink);border-color:var(--pink);color:#fff;transform:scale(1.2) rotate(360deg)}

/* question */
.btns{position:relative;display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:120px}
#yes,#no{font:900 1.2rem Cairo,Tahoma,sans-serif;border:0;border-radius:50px;padding:14px 34px;color:#fff;cursor:pointer;transition:transform .25s}
#yes{background:linear-gradient(90deg,#ff4d8d,#ff8fab);box-shadow:0 0 30px rgba(255,77,141,.8)}
@keyframes beatb{50%{box-shadow:0 0 50px rgba(255,77,141,1)}}
#no{background:#4a3a5c;position:relative}
#no.run{position:fixed;z-index:9;transition:left .25s,top .25s,transform .25s}

/* brand */
.brand{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:6px}
.cobra{width:78px;height:78px;border-radius:50%;object-fit:cover;border:2px solid #39ff6a;box-shadow:0 0 18px #39ff6a,0 0 40px rgba(57,255,106,.45)}
@keyframes glowg{50%{box-shadow:0 0 30px #39ff6a,0 0 70px rgba(57,255,106,.6)}}
.ava{position:relative;font:900 2.2rem/1 Cairo,Tahoma,sans-serif;letter-spacing:.18em;direction:ltr;padding:6px 0 0 .18em;color:#fff;text-shadow:0 0 8px var(--pink),0 0 22px var(--pink),0 0 44px #c2255c}
.ava::before{content:"♥";position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:.7rem;letter-spacing:0;color:var(--pink);animation:beat2 1s infinite}

/* finale */
.big{font-size:clamp(4rem,22vw,8rem);animation:beat2 1s infinite}
@keyframes beat2{50%{transform:scale(1.15)}}
.meter{margin:18px auto;max-width:360px}
.bar{height:16px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--gold));transition:width 2.6s cubic-bezier(.2,.8,.2,1)}
#pct{margin-top:6px;color:var(--gold);font-weight:900}
.cps{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 16px}
.cp{position:relative;border:2px dashed var(--gold);border-radius:14px;padding:12px 8px;cursor:pointer;background:rgba(255,210,122,.07);font-weight:700}
.cp span{display:block;font-size:1.8rem}
.cp.used::after{content:"تم الاستلام ✓";position:absolute;inset:0;display:grid;place-items:center;background:rgba(194,37,92,.9);border-radius:12px;font-weight:900;animation:stamp .4s}
@keyframes stamp{from{transform:scale(2);opacity:0}}
.sig{color:var(--gold);font-size:1.3rem;margin-top:10px}
.logo{width:84px;height:84px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.35);box-shadow:0 0 24px rgba(80,255,120,.55),0 0 50px rgba(255,77,141,.35)}
.logo.sm{width:56px;height:56px;margin-inline-start:12px;vertical-align:middle}
@keyframes lg{50%{transform:scale(1.07);box-shadow:0 0 34px rgba(80,255,120,.8),0 0 70px rgba(255,77,141,.5)}}
</style>
</head>

<canvas id="c"></canvas>

  <button class="ubtn" id="open">افتحي 💌</button>

promises:['أسمعك الأول قبل ما أرد','مش هسيبك تزعلي وأنا ساكت','أفتكر التفاصيل اللي تهمك','أقولك بحبك أكتر','أحاول أبقى أحسن كل يوم'],
coupons:[['🍫','شوكولاتة'],['🍽️','عشا على حسابي'],['🤗','حضن مفتوح'],['🎬','فيلم باختيارك']],
final:'شكراً إنك بتسامحيني… وعد مني أحاول أكون أحسن عشانك كل يوم. إنتي مش بس حبيبتي، إنتي أماني وفرحتي وأحلى حاجة في دنيتي. 🌹',
nolines:['إيه ده؟! جربي تاني 😏','مش هتعرفي تمسكيه 😂','بجد؟ بعد كل ده؟ 🥺','الزرار ده بيخاف منك 🏃‍♂️','بدأ يصغر من الخوف 😅','خلاص الزرار تعب… اختاري أيوه 💕','مفيش لأ في القاموس ده 😎','استسلم 😂💕']
};

/* sound */
let AC,mute=false;
function chime(f=660){if(mute)return;try{AC=AC||new(window.AudioContext||webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.12,n+.02);g.gain.exponentialRampToValueAtTime(.0001,n+.7);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+.75)}catch(e){}}
$('snd').onclick=e=>{mute=!mute;bgm.muted=mute;e.target.textContent=mute?'🔇':'🔊';e.stopPropagation()};

/* background music: ملف الأغنية لو موجود، وإلا لحن رومانسي مولّد */
const bgm=new Audio();bgm.loop=true;bgm.volume=.5;
let mus=0;
function tone(f,d,v,ty){if(mute||!AC)return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v,n+.05);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d+.05)}
function synth(){
  AC=AC||new(window.AudioContext||webkitAudioContext)();AC.resume&&AC.resume();
  const ch=[[220,261.6,329.6],[174.6,220,261.6],[261.6,329.6,392],[196,246.9,293.7]],pt=[0,1,2,1,0,2,1,2];
  let i=0;setInterval(()=>{const c=ch[(i>>3)%4],k=i%8;
    if(k===0)tone(c[0]/2,3.2,.09,'sine');
    tone(c[pt[k]]*2,1.1,.06,'triangle');
    if(k===4)tone(c[2]*4,1.6,.035,'sine');
    i++},460)
}
function startMusic(){
  if(mus)return;mus=1;bgm.src=CFG.song;
  const fb=()=>{if(mus===1){mus=2;synth()}};
  bgm.onerror=fb;
  const p=bgm.play();p&&p.catch(fb)
}
/* canvas */
const cv=$('c'),ctx=cv.getContext('2d');
let W,H,dpr=Math.min(devicePixelRatio||1,1.5);
function rs(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',rs);rs();
const emo=['❤','💖','💕','✨','🌹','💗'],P=[];
function mk(x,y,b){return{x,y,e:emo[rnd(0,emo.length)|0],s:rnd(14,34),vx:b?rnd(-7,7):rnd(-.3,.3),vy:b?rnd(-12,-2):-rnd(.4,1.6),g:b?.25:0,life:b?rnd(80,150):1e9,r:rnd(-.04,.04),rot:0,wob:rnd(0,6),amb:!b}}
for(let i=0;i<18;i++)P.push(mk(rnd(0,W),rnd(0,H),false));
const stars=Array.from({length:50},()=>({x:rnd(0,1),y:rnd(0,1),r:rnd(.5,1.8),p:rnd(0,6)}));
const SP={};function spr(e){if(SP[e])return SP[e];const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');x.font='48px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(e,32,34);return SP[e]=c}
let t=0,sh=null;
function loop(){
  t+=.02;ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';
  for(const s of stars){ctx.globalAlpha=.4+.6*Math.abs(Math.sin(t+s.p));ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,7);ctx.fill()}
  if(!sh&&Math.random()<.006)sh={x:rnd(W*.4,W),y:rnd(0,H*.35),l:0};
  if(sh){ctx.globalAlpha=1-sh.l/40;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sh.x,sh.y);ctx.lineTo(sh.x+40,sh.y-18);ctx.stroke();sh.x-=9;sh.y+=4;if(++sh.l>40)sh=null}
  for(let i=P.length-1;i>=0;i--){
    const p=P[i];
    p.x+=p.vx+(p.amb?Math.sin(t+p.wob)*.5:0);p.y+=p.vy;p.vy+=p.g;p.rot+=p.r;p.life--;
    if(p.amb&&p.y<-40){p.y=H+40;p.x=rnd(0,W)}
    if(p.life<=0||p.y>H+60){P.splice(i,1);continue}
    ctx.globalAlpha=p.amb?.55:Math.min(1,p.life/40);
    if(p.dot){ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.fill()}
    else{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.drawImage(spr(p.e),-p.s/2,-p.s/2,p.s,p.s);ctx.restore()}
  }
  requestAnimationFrame(loop)
}
loop();
const burst=(x,y,n)=>{if(P.length>260)return;for(let i=0;i<n;i++)P.push(mk(x,y,true))};
function fw(x,y){const h=rnd(0,360);for(let i=0;i<32;i++){const a=i/32*6.283,v=rnd(2,6);P.push({x,y,c:`hsl(${h+rnd(-25,25)},100%,70%)`,s:rnd(1.5,3),vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.06,life:rnd(50,90),dot:1})}}
function petal(){P.push({x:rnd(0,W),y:-30,e:Math.random()<.5?'🌹':'🌸',s:rnd(16,26),vx:rnd(-.6,.6),vy:rnd(1,2.5),g:0,life:600,rot:0,r:rnd(-.05,.05)})}
addEventListener('pointermove',e=>{if(Math.random()<.3&&P.length<260)P.push({x:e.clientX,y:e.clientY,c:Math.random()<.5?'#ffd27a':'#ff9ac1',s:rnd(1.5,3.5),vx:rnd(-1,1),vy:rnd(-1,1),g:.03,life:30,dot:1})});
addEventListener('pointerdown',e=>{startMusic();burst(e.clientX,e.clientY,5);chime(rnd(520,880))});

/* flow */
const hooks={};
function go(id){document.querySelectorAll('.stage').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');$(id).scrollTop=0;chime(784);hooks[id]&&hooks[id]()}
document.querySelectorAll('.next').forEach(b=>b.onclick=()=>go(b.dataset.to));
const nextOf=id=>$(id).querySelector('.next');
function type(el,txt,sp,cb){el.textContent='';let i=0;(function n(){el.textContent=txt.slice(0,++i);if(i<txt.length)setTimeout(n,sp);else cb&&cb()})()}

$('env').onclick=()=>{startMusic();
  if($('env').classList.contains('open'))return;
  $('env').classList.add('open');chime(880);
  const r=$('env').getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,40);
  setTimeout(()=>go('s2'),1700)
};

/* lock */
const norm=v=>v.replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/\D/g,'');
const FI=['dd','mm','yy'].map($);let bad=0,opened=false;
FI.forEach((el,i)=>{
  el.addEventListener('input',()=>{el.value=norm(el.value);if(el.value.length>=el.maxLength&&FI[i+1])FI[i+1].focus()});
  el.addEventListener('keydown',e=>{if(e.key==='Enter')unlock();if(e.key==='Backspace'&&!el.value&&FI[i-1])FI[i-1].focus()});
});
const WR=['لأ مش التاريخ ده 😏 فكري تاني…','قربتي؟ لأ لسه 😂 جربي تاني','ده اليوم اللي الدنيا نوّرت فيه 🎂','تلميح: اليوم / الشهر / السنة 💡'];
function unlock(){
  if(opened)return;
  const d=+norm($('dd').value),m=+norm($('mm').value),y=+norm($('yy').value),B=CFG.bd;
  if(y===B.y&&((d===B.d&&m===B.m)||(d===B.m&&m===B.d))){
    opened=true;$('lk').textContent='🔓';$('lmsg').textContent='أيوه كده يا حورية 🥰';
    chime(988);burst(W/2,H/2,40);setTimeout(()=>go('s1'),1200)
  }else{
    $('lmsg').textContent=WR[Math.min(bad++,WR.length-1)];
    const b=document.querySelector('.dob');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')
  }
}
$('open').onclick=unlock;

/* letter */
CFG.letter.forEach(l=>{const p=document.createElement('p');p.innerHTML=l;$('msg').append(p)});
hooks.s2=()=>{const ps=[...document.querySelectorAll('#msg p')];
  ps.forEach((p,i)=>setTimeout(()=>{p.classList.add('show');chime(500+i*40)},600+i*1700));
  setTimeout(()=>nextOf('s2').classList.add('show'),600+ps.length*1700)};

/* reasons */
let fl=0;
CFG.reasons.forEach(([ic,tt,x],i)=>{
  const d=document.createElement('div');d.className='card';d.style.animationDelay=i*.1+'s';
  d.innerHTML=`<div class="i"><div class="f"><span>${ic}</span>${tt}</div><div class="k">${x}</div></div>`;
  d.onclick=()=>{if(d.classList.contains('flip'))return;d.classList.add('flip');chime(520+i*70);
    const r=d.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,8);
    if(++fl>=CFG.reasons.length)nextOf('s3').classList.add('show')};
  $('cards').append(d)});

/* promises */
CFG.promises.forEach(x=>{const li=document.createElement('li');li.innerHTML=`<span class="ck">✓</span>${x}`;$('pl').append(li)});
hooks.s4=()=>{const ls=[...document.querySelectorAll('#pl li')];
  ls.forEach((li,i)=>setTimeout(()=>{li.classList.add('ok');chime(600+i*90);burst(W/2,H/2,6)},900+i*1000));
  setTimeout(()=>nextOf('s4').classList.add('show'),900+ls.length*1000)};

/* the runaway "no" */
const no=$('no'),yes=$('yes');let tries=0,sc=1,give=false,done=false;
function flee(e){
  if(give){if(e.type==='click')finish();return}
  e.preventDefault();tries++;no.classList.add('run');
  const bw=no.offsetWidth,bh=no.offsetHeight;
  no.style.left=rnd(10,W-bw-10)+'px';no.style.top=rnd(10,H-bh-10)+'px';
  sc=Math.min(sc+.15,2.1);yes.style.transform=`scale(${sc})`;
  no.style.transform=`scale(${Math.max(.6,1-tries*.05)})`;
  $('tip').textContent=CFG.nolines[Math.min(tries-1,CFG.nolines.length-1)];
  if(tries>3)no.textContent=['لأ','ل…','🥲'][tries%3];
  if(tries>=8){give=true;no.classList.remove('run');no.style.cssText='background:linear-gradient(90deg,#ff4d8d,#ff8fab)';no.textContent='ماشي… أيوه 🥹'}
  burst(rnd(0,W),H,3)
}
no.addEventListener('mouseenter',flee);
no.addEventListener('touchstart',flee,{passive:false});
no.addEventListener('click',flee);

/* finale */
function finish(){if(done)return;done=true;go('s6')}
yes.onclick=finish;
CFG.coupons.forEach(([ic,x])=>{const d=document.createElement('div');d.className='cp';d.innerHTML=`<span>${ic}</span>${x}`;d.onclick=()=>{d.classList.add('used');chime(988);burst(innerWidth/2,innerHeight/2,12)};$('cps').append(d)});
hooks.s6=()=>{
  let k=0;const iv=setInterval(()=>{fw(rnd(W*.15,W*.85),rnd(H*.15,H*.5));burst(rnd(W*.1,W*.9),H,10);chime([523,659,784,1047][k%4]);if(++k>12)clearInterval(iv)},450);
  setInterval(()=>fw(rnd(W*.1,W*.9),rnd(H*.1,H*.45)),2600);
  setInterval(petal,700);
  type($('fm'),CFG.final,45);
  setTimeout(()=>{$('bar').style.width='100%';let n=0;const m=setInterval(()=>{n+=2;$('pct').textContent='حبي ليكي: '+n+'%';if(n>=100){clearInterval(m);$('pct').textContent='حبي ليكي: ∞ 💞'}},50)},1200)
};
</script>
